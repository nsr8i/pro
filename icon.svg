<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#221812" />
      <stop offset="60%" stop-color="#121418" />
      <stop offset="100%" stop-color="#090a0d" />
    </radialGradient>
    <linearGradient id="goldOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7f32" />
      <stop offset="50%" stop-color="#db5200" />
      <stop offset="100%" stop-color="#b83800" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#db5200" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" />
  <rect x="2" y="2" width="508" height="508" rx="106" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.08" />

  <!-- Outer ambient ring -->
  <circle cx="256" cy="220" r="160" fill="none" stroke="url(#goldOrange)" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 6"/>

  <!-- Brand Emblem (Preksha Luminaire Monogram Arrowhead) centered -->
  <g transform="translate(148, 70) scale(1.35)" filter="url(#glow)">
    <path fill="url(#goldOrange)" fill-rule="evenodd" d="M 28,14
      L 188,110
      L 126,112
      L 100,88
      C 94,142 78,210 44,270
      C 40,276 32,274 30,268
      C 22,185 24,90 28,14
      Z
      M 64,62
      L 160,100
      L 86,100
      Z"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="420" font-family="'Cinzel', 'Montserrat', Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="7" text-anchor="middle">PREKSHA</text>
  <text x="256" y="450" font-family="'Montserrat', Arial, sans-serif" font-size="14" font-weight="600" fill="#ff7f32" letter-spacing="4" text-anchor="middle">LIGHTING WORLD</text>
</svg>